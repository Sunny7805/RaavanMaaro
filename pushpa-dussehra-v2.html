<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pushpa ka Dussehra</title>
<style>
:root{--bg:#12071f;--gold:#ffc93c;--ink:#fff4e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12071f}}
:root[data-theme="dark"]{--bg:#12071f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,'Noto Serif Devanagari',serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;font-size:15px}
#bar{width:120px;height:12px;border:2px solid var(--gold);border-radius:8px;overflow:hidden;background:rgba(0,0,0,.4)}
#fill{height:100%;width:100%;background:linear-gradient(90deg,#e8321e,var(--gold));transition:width .3s}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);text-align:center;font-size:13px;opacity:.8;pointer-events:none}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;background:rgba(18,7,31,.82);transition:opacity .5s}
#msg h1{font-size:clamp(32px,10vw,58px);color:var(--gold);line-height:1.15;margin-bottom:12px}
#msg p{max-width:28ch;margin-bottom:24px;font-size:18px;line-height:1.55}
button{font:inherit;font-size:19px;padding:14px 30px;border:0;border-radius:30px;background:var(--gold);color:#3a1200;font-weight:bold;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#mu{pointer-events:auto;padding:4px 10px;font-size:18px;background:rgba(0,0,0,.45);color:inherit;border-radius:14px}
.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span>Teer: <b id="n">0</b></span><button id="mu" aria-label="Awaaz on ya off">🔊</button><div id="bar"><div id="fill"></div></div></div>
<div id="hint">Ungli se nishana lagao, chhodte hi teer chalega</div>
<div id="msg">
<h1 id="t">Pushpa ka Dussehra</h1>
<p id="p">Dhanush uthao aur Raavan ka ant karo. Jai Shri Ram!</p>
<button id="go">Maaro Raavan Ko!</button>
</div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),R=Math.random,TAU=6.2832;
let W,H,cx,G,S,arrows=[],parts=[],flames=[],rockets=[],marks=[],stars=[],shots=0,hp=5,st='ready',burnT=0,shake=0,aim=null,tick=0;
for(let i=0;i<90;i++)stars.push([R(),R()*.55,R()*1.6+.4,R()*6]);
let AC,nb,mute=false;
function unlock(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();const l=AC.sampleRate*2;nb=AC.createBuffer(1,l,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<l;i++)d[i]=R()*2-1}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume()}
function noise(dur,f0,f1,vol,type,q,dl){const a=AC;if(!a||mute)return;const t=a.currentTime+(dl||0),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=nb;f.type=type||'lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);if(q)f.Q.value=q;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+dur)}
function tone(f0,f1,dur,vol,type,dl){const a=AC;if(!a||mute)return;const t=a.currentTime+(dl||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur)}
const sTwang=()=>{tone(240,90,.25,.3,'triangle');noise(.4,600,3500,.25,'bandpass',1.5)};
const sHit=()=>{tone(130,35,.5,.6);noise(.5,3500,200,.5);for(let i=0;i<5;i++)noise(.07,5000,500,.3,'lowpass',0,.08*i+.1)};
const sWhistle=()=>tone(500,1900,.7,.1);
const sBoom=()=>{noise(.9,1500,60,.55);tone(100,30,.7,.5);for(let i=0;i<6;i++)noise(.05,6000,800,.15,'lowpass',0,.1+i*.06)};
const sCrack=()=>noise(.05+R()*.05,5000,900,.12+R()*.1,'bandpass',2);
const sRumble=()=>{noise(1.8,400,40,.6);tone(70,25,1.5,.5,'sawtooth')};
const sDhol=()=>{for(let i=0;i<4;i++){tone(120,45,.25,.55,'sine',i*.2);noise(.06,2500,800,.2,'lowpass',0,i*.2)}};
const sFan=()=>[523,659,784,1047].forEach((f,i)=>{tone(f,f*1.003,.6,.22,'triangle',i*.25);tone(f/2,f/2,.6,.1,'sine',i*.25)});
document.getElementById('mu').onclick=()=>{mute=!mute;document.getElementById('mu').textContent=mute?'🔇':'🔊'};
cv.addEventListener('pointerdown',unlock);
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);cx=W/2;G=H*.74;S=Math.min(W/330,H*.56/450)}
addEventListener('resize',rs);rs();
const sy=()=>(st==='burn'||st==='done')?Math.max(.2,1-burnT/300):1;
const rp=(ux,uy)=>[cx+ux*S,G+uy*S*sy()];
const COLS=['#ffc93c','#ff5a1f','#ff2e88','#7cffcb','#fff','#6ab7ff'];
function boom(px,py,n,sp){for(let i=0;i<n;i++){const a=R()*TAU,v=(R()*.8+.2)*(sp||5);parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,d:.012+R()*.014,c:COLS[(R()*6)|0],g:.05})}}
function rocket(){sWhistle();rockets.push({x:W*(.15+R()*.7),y:H*.8,vy:-(9+R()*3),ty:H*(.1+R()*.3)})}
function bow(){const a=aim?Math.max(-3.05,Math.min(-.09,Math.atan2(aim.y-H*.88,aim.x-cx))):-Math.PI/2;return{x:cx,y:H*.88,a}}
function shoot(){if(st!=='play'||!aim)return;const b=bow();arrows.push({x:b.x+Math.cos(b.a)*20,y:b.y+Math.sin(b.a)*20,vx:Math.cos(b.a)*24,vy:Math.sin(b.a)*24});shots++;document.getElementById('n').textContent=shots;boom(b.x,b.y,10,3);sTwang()}
function hit(a){hp--;shake=12;sHit();document.getElementById('fill').style.width=hp/5*100+'%';
 const ux=(a.x-cx)/S,uy=(a.y-G)/S;marks.push([ux,uy]);boom(a.x,a.y,45,6);
 for(let i=0;i<8;i++)flames.push({ux:ux+(R()-.5)*50,uy:uy+(R()-.5)*50,l:1+R(),s:12+R()*16});
 if(hp<=0){st='burn';burnT=0;sRumble()}}
function endGame(){st='done';sFan();document.getElementById('t').innerHTML='Happy Dussehra,<br>Pushpa!';
 document.getElementById('p').textContent='Burai par achchai ki jeet. Aaj ka din tumhare liye khushiyan lekar aaye!';
 document.getElementById('go').textContent='Doobara Maaro S@@le Ko!';document.getElementById('msg').classList.remove('hide')}
document.getElementById('go').onclick=()=>{unlock();sDhol();hp=5;shots=0;arrows=[];flames=[];marks=[];burnT=0;aim=null;document.getElementById('n').textContent=0;document.getElementById('fill').style.width='100%';st='play';document.getElementById('msg').classList.add('hide');for(let i=0;i<3;i++)rocket()};
cv.addEventListener('pointerdown',e=>{aim={x:e.clientX,y:e.clientY}});
cv.addEventListener('pointermove',e=>{if(aim)aim={x:e.clientX,y:e.clientY}});
cv.addEventListener('pointerup',()=>{shoot();aim=null});
cv.addEventListener('pointercancel',()=>{aim=null});
function lg(x0,y0,x1,y1,s){const g=x.createLinearGradient(x0,y0,x1,y1);s.forEach((c,i)=>g.addColorStop(i/(s.length-1),c));return g}
function face(px,py,sc,h){x.save();x.translate(px,py);x.scale(sc,sc);x.lineJoin='round';x.lineCap='round';
 const sk=x.createRadialGradient(-5,-7,2,0,0,26);sk.addColorStop(0,'hsl('+h+',50%,56%)');sk.addColorStop(1,'hsl('+h+',55%,22%)');
 const au=lg(0,-48,0,-6,['#fff3b0','#f0b429','#9a5b06']);
 x.fillStyle=sk;x.fillRect(-10,14,20,16);
 x.fillStyle=au;[-20,20].forEach(e=>{x.beginPath();x.arc(e,8,4.5,0,TAU);x.fill()});
 x.lineWidth=1.5;x.strokeStyle='rgba(0,0,0,.55)';
 x.beginPath();x.ellipse(0,0,17,21,0,0,TAU);x.fillStyle=sk;x.fill();x.stroke();
 x.fillStyle=au;x.beginPath();x.moveTo(-19,-8);x.lineTo(-23,-34);x.lineTo(-12,-24);x.lineTo(-6,-48);x.lineTo(0,-30);x.lineTo(6,-48);x.lineTo(12,-24);x.lineTo(23,-34);x.lineTo(19,-8);x.closePath();x.fill();x.stroke();
 x.fillStyle='#fff';[[-23,-35],[-6,-49],[6,-49],[23,-35]].forEach(p=>{x.beginPath();x.arc(p[0],p[1],2.3,0,TAU);x.fill()});
 x.fillStyle='#e0142b';x.beginPath();x.moveTo(0,-27);x.lineTo(4.5,-19);x.lineTo(0,-11);x.lineTo(-4.5,-19);x.fill();
 x.fillStyle=au;x.fillRect(-19,-13,38,6);
 x.strokeStyle='#120604';x.lineWidth=5;x.beginPath();x.moveTo(-15,-6);x.lineTo(-3,0);x.moveTo(15,-6);x.lineTo(3,0);x.stroke();
 [-7.5,7.5].forEach(e=>{x.fillStyle='#fff';x.beginPath();x.ellipse(e,3,4.6,2.8,e<0?.3:-.3,0,TAU);x.fill();
  const g=x.createRadialGradient(e,3,0,e,3,4);g.addColorStop(0,'#fff27a');g.addColorStop(.5,'#ff2a10');g.addColorStop(1,'#a00');x.fillStyle=g;x.beginPath();x.arc(e,3,2.7,0,TAU);x.fill()});
 x.strokeStyle='rgba(0,0,0,.4)';x.lineWidth=2;x.beginPath();x.moveTo(0,5);x.lineTo(-3,11);x.lineTo(3,11);x.stroke();
 x.fillStyle='#4a0606';x.beginPath();x.ellipse(0,17,7,4,0,0,TAU);x.fill();
 x.fillStyle='#fff';x.beginPath();x.moveTo(-5,14);x.lineTo(-3.4,19.5);x.lineTo(-1.6,14);x.moveTo(5,14);x.lineTo(3.4,19.5);x.lineTo(1.6,14);x.fill();
 x.strokeStyle='#120604';x.lineWidth=3.5;x.beginPath();x.moveTo(0,11);x.quadraticCurveTo(-13,9,-19,14);x.quadraticCurveTo(-25,18,-21,6);x.moveTo(0,11);x.quadraticCurveTo(13,9,19,14);x.quadraticCurveTo(25,18,21,6);x.stroke();
 x.restore()}
function ravan(){const T=lg(-70,-210,70,-130,['#4a8fba','#2d6288','#1b3f5e']),au=lg(0,-10,0,10,['#fff3b0','#e8a317','#8a5206']);
 const al=st==='done'?Math.max(0,1-(burnT-200)/130):1;if(al<=0)return;
 const [ox,oy]=rp(0,0);x.save();x.globalAlpha=al;x.translate(ox+(shake>0?(R()-.5)*shake:0),oy);x.scale(S,S*sy());x.lineCap='round';x.lineJoin='round';
 // glow
 const gl=x.createRadialGradient(0,-250,20,0,-250,280);gl.addColorStop(0,'rgba(255,150,40,'+(.35+.1*Math.sin(tick/20))+')');gl.addColorStop(1,'rgba(255,80,20,0)');x.fillStyle=gl;x.fillRect(-300,-540,600,600);
 // dhoti
 x.fillStyle=lg(-50,-125,50,0,['#f6b52a','#e08a12','#a85a08']);x.beginPath();x.moveTo(-50,-128);x.lineTo(50,-128);x.lineTo(60,-10);x.lineTo(6,-10);x.lineTo(0,-75);x.lineTo(-6,-10);x.lineTo(-60,-10);x.closePath();x.fill();
 x.strokeStyle='rgba(120,30,0,.5)';x.lineWidth=2;x.beginPath();for(let i=-40;i<=40;i+=16){x.moveTo(i,-120);x.lineTo(i*1.3,-14)}x.stroke();
 x.fillStyle='#b3201a';x.fillRect(-55,-62,110,6);x.fillStyle='#1b0f0a';x.beginPath();x.ellipse(-32,-6,26,7,0,0,TAU);x.ellipse(32,-6,26,7,0,0,TAU);x.fill();
 // torso
 x.fillStyle=T;x.beginPath();x.moveTo(-52,-135);x.lineTo(-76,-212);x.lineTo(76,-212);x.lineTo(52,-135);x.closePath();x.fill();x.fillRect(-13,-232,26,26);
 x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=2.5;x.beginPath();x.moveTo(0,-205);x.lineTo(0,-145);x.moveTo(-44,-188);x.quadraticCurveTo(-22,-168,-3,-182);x.moveTo(44,-188);x.quadraticCurveTo(22,-168,3,-182);x.moveTo(-26,-160);x.lineTo(-4,-158);x.moveTo(26,-160);x.lineTo(4,-158);x.stroke();
 // jewelry
 x.strokeStyle='#ffc93c';x.lineWidth=6;x.beginPath();x.moveTo(-50,-210);x.quadraticCurveTo(0,-145,50,-210);x.stroke();
 x.strokeStyle='#d11';x.lineWidth=4;x.setLineDash([2,8]);x.beginPath();x.moveTo(-38,-210);x.quadraticCurveTo(0,-168,38,-210);x.stroke();x.setLineDash([]);
 x.fillStyle='#e0142b';x.beginPath();x.arc(0,-167,6,0,TAU);x.fill();
 x.save();x.translate(0,-132);x.fillStyle=au;x.fillRect(-54,-9,108,18);x.fillStyle='#e0142b';x.beginPath();x.arc(0,0,7,0,TAU);x.fill();x.restore();
 // arms
 const arm=(sx,ex,ey)=>{x.strokeStyle=T;x.lineWidth=19;x.beginPath();x.moveTo(sx*68,-200);x.lineTo(sx*ex,ey);x.stroke();
  x.fillStyle=au;x.beginPath();x.arc(sx*70,-205,16,0,TAU);x.fill();x.strokeStyle='#8a5206';x.lineWidth=2;x.stroke();
  x.fillStyle='#ffc93c';x.beginPath();x.arc(sx*ex,ey,11,0,TAU);x.fill();x.fillStyle='#2d6288';x.beginPath();x.arc(sx*ex,ey,8,0,TAU);x.fill()};
 // weapons first (behind hands)
 x.lineWidth=6;x.strokeStyle='#e4ecf5';x.beginPath();x.moveTo(130,-252);x.lineTo(130,-345);x.stroke();x.strokeStyle='#ffc93c';x.lineWidth=7;x.beginPath();x.moveTo(117,-262);x.lineTo(143,-262);x.stroke();
 x.strokeStyle='#8a5a2b';x.lineWidth=7;x.beginPath();x.moveTo(140,-196);x.lineTo(140,-275);x.stroke();x.fillStyle='#8c8f96';x.beginPath();x.arc(140,-284,14,0,TAU);x.fill();x.fillStyle='#555';for(let i=0;i<6;i++){x.beginPath();x.arc(140+Math.cos(i)*14,-284+Math.sin(i)*14,3,0,TAU);x.fill()}
 x.strokeStyle='#ffc93c';x.lineWidth=5;x.beginPath();x.moveTo(-130,-252);x.lineTo(-130,-345);x.moveTo(-143,-330);x.quadraticCurveTo(-130,-308,-117,-330);x.moveTo(-143,-330);x.lineTo(-143,-348);x.moveTo(-117,-330);x.lineTo(-117,-348);x.moveTo(-130,-345);x.lineTo(-130,-360);x.stroke();
 arm(-1,130,-252);arm(-1,140,-196);arm(-1,124,-150);arm(1,130,-252);arm(1,140,-196);arm(1,124,-150);
 x.fillStyle='#b3201a';x.beginPath();x.arc(-124,-150,28,0,TAU);x.fill();x.strokeStyle='#ffc93c';x.lineWidth=5;x.stroke();x.fillStyle='#ffc93c';x.beginPath();x.arc(-124,-150,8,0,TAU);x.fill();
 // heads fan
 [0,1,2,3,4,5,6,7,8].map(i=>{const a=Math.PI+(i+.5)/9*Math.PI;return[Math.cos(a)*108,-262+Math.sin(a)*72,.62+.18*Math.sin((i+.5)/9*Math.PI),[205,150,12,270,205,150,12,270,205][i]]}).forEach(h=>face(h[0],h[1],h[2],h[3]));
 face(0,-248,1.25,205);
 // scorch marks
 marks.forEach(m=>{const g=x.createRadialGradient(m[0],m[1],0,m[0],m[1],20);g.addColorStop(0,'rgba(0,0,0,.65)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(m[0],m[1],20,0,TAU);x.fill()});
 x.restore()}
function pushpa(){const p=Math.min(H/800,1.25),fy=H*.985,b=bow();
 x.save();x.translate(cx,fy);
 x.fillStyle=lg(0,-100*p,0,0,['#ff4fa3','#c4177a','#7a0b4d']);x.beginPath();x.moveTo(-14*p,-92*p);x.lineTo(14*p,-92*p);x.lineTo(30*p,0);x.lineTo(-30*p,0);x.fill();
 x.fillStyle='#ffc93c';x.fillRect(-26*p,-8*p,52*p,5*p);
 x.fillStyle='#1a0a05';x.beginPath();x.ellipse(-8*p,-96*p,17*p,19*p,0,0,TAU);x.fill();x.fillRect(-24*p,-100*p,8*p,52*p);
 x.fillStyle='#ffd7a8';x.beginPath();x.arc(0,-108*p,13*p,0,TAU);x.fill();
 x.fillStyle='#1a0a05';x.beginPath();x.arc(0,-112*p,13.5*p,Math.PI*1.02,TAU*.99);x.fill();
 x.fillStyle='#ff8a1f';x.beginPath();x.arc(10*p,-122*p,6*p,0,TAU);x.fill();x.fillStyle='#d11';x.beginPath();x.arc(0,-110*p,1.8*p,0,TAU);x.fill();
 x.restore();
 x.save();x.translate(b.x,b.y);x.rotate(b.a);const r=48*p,pull=aim?-16*p:0;
 x.strokeStyle=lg(-r,0,r,0,['#fff3b0','#e8a317','#8a5206']);x.lineWidth=6;x.lineCap='round';x.beginPath();x.arc(0,0,r,-1.15,1.15);x.stroke();
 const ex=Math.cos(1.15)*r,ey=Math.sin(1.15)*r;x.strokeStyle='#fff';x.lineWidth=1.5;x.beginPath();x.moveTo(ex,-ey);x.lineTo(pull,0);x.lineTo(ex,ey);x.stroke();
 if(aim){x.strokeStyle='#fff4e0';x.lineWidth=3;x.beginPath();x.moveTo(pull,0);x.lineTo(r*.9,0);x.stroke();x.fillStyle='#ff5a1f';x.beginPath();x.moveTo(r*.9+10,0);x.lineTo(r*.9,-5);x.lineTo(r*.9,5);x.fill();
  x.fillStyle='rgba(255,201,60,.8)';for(let d=r+40;d<H;d+=26){x.beginPath();x.arc(d,0,2.2,0,TAU);x.fill()}}
 x.restore();
 x.strokeStyle='#ffd7a8';x.lineWidth=7*p;x.lineCap='round';x.beginPath();x.moveTo(cx-10*p,fy-85*p);x.lineTo(b.x+Math.cos(b.a)*r*.6,b.y+Math.sin(b.a)*r*.6);x.stroke();
 x.beginPath();x.moveTo(cx+10*p,fy-85*p);x.lineTo(b.x+Math.cos(b.a)*pull,b.y+Math.sin(b.a)*pull);x.stroke()}
function scene(){
 x.fillStyle=lg(0,0,0,G,['#0e0620','#3a0f4a','#8a2548','#e8672a']);x.fillRect(0,0,W,G+2);
 stars.forEach(s=>{x.fillStyle='rgba(255,255,255,'+(.35+.55*Math.sin(tick/30+s[3]))+')';x.fillRect(s[0]*W,s[1]*H,s[2],s[2])});
 const mg=x.createRadialGradient(W*.16,H*.13,2,W*.16,H*.13,60);mg.addColorStop(0,'#fff9e0');mg.addColorStop(.35,'#ffe9a8');mg.addColorStop(1,'rgba(255,230,160,0)');x.fillStyle=mg;x.fillRect(0,0,W*.5,H*.3);
 x.fillStyle='#1b0a22';x.beginPath();x.moveTo(0,G);for(let i=0;i<=W;i+=W/10){const k=(i/(W/10))|0;x.lineTo(i,G-14-(k%3)*10);x.lineTo(i+W/20,G-44-(k%2)*30);}x.lineTo(W,G);x.fill();
 x.fillStyle=lg(0,G,0,H,['#3a1a0c','#1a0a05']);x.fillRect(0,G,W,H-G);
 for(let i=0;i<W;i+=22){const f=.7+.3*Math.sin(tick/8+i);const g=x.createRadialGradient(i+8,G+14,0,i+8,G+14,10);g.addColorStop(0,'rgba(255,220,100,'+f+')');g.addColorStop(1,'rgba(255,120,20,0)');x.fillStyle=g;x.fillRect(i-4,G+4,24,20)}}
function loop(){tick++;scene();
 if(shake>0)shake--;
 ravan();pushpa();
 arrows=arrows.filter(a=>{a.x+=a.vx;a.y+=a.vy;a.vy+=.08;const an=Math.atan2(a.vy,a.vx);
  parts.push({x:a.x,y:a.y,vx:R()-.5,vy:R()-.5,l:1,d:.07,c:'#ff8a1f',g:0});
  x.save();x.translate(a.x,a.y);x.rotate(an);x.fillStyle='#fff4e0';x.fillRect(-32,-1.5,36,3);x.fillStyle='#ff5a1f';x.beginPath();x.moveTo(11,0);x.lineTo(2,-5);x.lineTo(2,5);x.fill();x.restore();
  if(st==='play'&&Math.abs(a.x-cx)<115*S&&a.y>G-440*S&&a.y<G-10*S){hit(a);return false}
  return a.y>-40&&a.x>-40&&a.x<W+40});
 if(st==='burn'||st==='done'){burnT++;
